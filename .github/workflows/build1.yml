name: Get Signed APK Only

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        required: true
        type: string
      key_alias:
        required: true
        type: string
      key_password:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      
      - name: Setup SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
      
      - name: Generate Keystore
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          keytool -genkey -v -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Dev"
          echo "MINIMUM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "MINIMUM_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "MINIMUM_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "MINIMUM_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          cat > app/signing.gradle <<'EOF'
          android { signingConfigs { release { storeFile file(System.getenv("MINIMUM_KEYSTORE_PATH")); storePassword System.getenv("MINIMUM_STORE_PASSWORD"); keyAlias System.getenv("MINIMUM_KEY_ALIAS"); keyPassword System.getenv("MINIMUM_KEY_PASSWORD") } } buildTypes { release { signingConfig signingConfigs.release } } }
          EOF
      
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-signed-apk
          path: app/build/outputs/apk/foss/release/mumla-foss-release.apk
