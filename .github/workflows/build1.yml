name: Build Signed APK Only (No Tests)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis (contoh: 1.0.1)
        required: true
        type: string
      keystore_password:
        description: Password keystore (min 6 karakter)
        required: true
        type: string
      key_alias:
        description: Alias kunci (tanpa spasi)
        required: true
        type: string
      key_password:
        description: Password kunci (bisa sama dengan keystore password)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-apk:
    name: Build & Save Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "platform-tools"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
          echo "✅ SDK & NDK ready"

      - name: Generate Keystore on x64 Runner
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/minimum-release.jks"
          
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Minimum Dev, OU=Dev, O=Ofaid, L=Indonesia, ST=Jawa, C=ID"
          
          FILE_SIZE=$(wc -c < "$KEYSTORE_PATH")
          echo "✅ Keystore created! Size: $FILE_SIZE bytes"
          
          echo "MINIMUM_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MINIMUM_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "MINIMUM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MINIMUM_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          
          cat > app/signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("MINIMUM_KEYSTORE_PATH"))
                      storePassword System.getenv("MINIMUM_STORE_PASSWORD")
                      keyAlias System.getenv("MINIMUM_KEY_ALIAS")
                      keyPassword System.getenv("MINIMUM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          
          echo "✅ Signing config ready!"

      - name: Build SpongyCastle Library
        working-directory: libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon --stacktrace

      - name: Prepare APK for Upload
        run: |
          mkdir -p signed-apk-output
          cp app/build/outputs/apk/foss/release/mumla-foss-release.apk signed-apk-output/minimum-signed-release.apk
          echo "✅ APK copied to signed-apk-output/"

      - name: Upload Signed APK as Artifact (GUARANTEED SAVE)
        uses: actions/upload-artifact@v4
        with:
          name: minimum-signed-release-apk
          path: signed-apk-output/minimum-signed-release.apk
          retention-days: 30
          if-no-files-found: error
