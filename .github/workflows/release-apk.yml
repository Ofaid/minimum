name: Release signed APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis (contoh: 1.0.1)
        required: true
        type: string
      prerelease:
        description: Tandai sebagai pra-rilis
        required: true
        default: true
        type: boolean
      expected_version_code:
        description: Kode versi (contoh: 3070301)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Bangun & Tanda Tangani APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Validasi format tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag harus berupa x.y.z contoh: 1.0.1" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Kode versi harus angka" >&2
            exit 1
          fi

      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          cmdline-tools: "latest"

      - name: Pasang NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Bangun pustaka SpongyCastle
        working-directory: libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon

      - name: Bangun APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon --stacktrace

      - name: Siapkan APK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          APK_SRC=app/build/outputs/apk/foss/release/mumla-foss-release.apk
          APK_OUT=aplikasi-$TAG.apk
          if [[ ! -f "$APK_SRC" ]]; then
            echo "APK tidak ditemukan!" >&2
            exit 1
          fi
          cp "$APK_SRC" "$APK_OUT"
          sha256sum "$APK_OUT" > "$APK_OUT.sha256"

      - name: Unggah ke Rilis
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRE_FLAG="--prerelease"
          gh release create "$TAG" \
            "aplikasi-$TAG.apk" \
            "aplikasi-$TAG.apk.sha256" \
            $PRE_FLAG \
            --title "Rilis $TAG" \
            --notes "Berhasil dibangun! 🎉"
