name: Release signed APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag pointing at the commit to build (contoh: 1.0.1)
        required: true
        type: string
      prerelease:
        description: Tandai sebagai versi pra-rilis
        required: true
        default: true
        type: boolean
      expected_version_code:
        description: Kode versi Android (contoh: 3070301)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Verifikasi, Tanda Tangan & Terbitkan APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Periksa format Tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag harus berupa angka x.y.z (contoh: 1.0.1)" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Kode versi harus berupa angka positif" >&2
            exit 1
          fi

      - name: Ambil kode dari cabang utama
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Pastikan Tag sama dengan kode terbaru
        id: authorize_release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          main_sha=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          tag_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Tag harus menunjuk ke komit terbaru di cabang main!" >&2
            exit 1
          fi
          echo "release_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Gunakan kode yang sudah diverifikasi
        env:
          RELEASE_SHA: ${{ steps.authorize_release.outputs.release_sha }}
        run: |
          git checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Periksa semua kunci rahasia
        env:
          MINIMUM_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINIMUM_RELEASE_KEYSTORE_BASE64 }}
          MINIMUM_RELEASE_STORE_PASSWORD: ${{ secrets.MINIMUM_RELEASE_STORE_PASSWORD }}
          MINIMUM_RELEASE_KEY_ALIAS: ${{ secrets.MINIMUM_RELEASE_KEY_ALIAS }}
          MINIMUM_RELEASE_KEY_PASSWORD: ${{ secrets.MINIMUM_RELEASE_KEY_PASSWORD }}
          MINIMUM_RELEASE_APPLICATION_ID: ${{ vars.MINIMUM_RELEASE_APPLICATION_ID }}
        run: |
          for value in \
            MINIMUM_RELEASE_KEYSTORE_BASE64 \
            MINIMUM_RELEASE_STORE_PASSWORD \
            MINIMUM_RELEASE_KEY_ALIAS \
            MINIMUM_RELEASE_KEY_PASSWORD \
            MINIMUM_RELEASE_APPLICATION_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Pengaturan $value belum diisi!" >&2
              exit 1
            fi
          done

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Pasang Android SDK ✅ FIXED
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          cmdline-tools: "latest"

      - name: Pasang NDK & Platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Siapkan berkas tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIMUM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINIMUM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIMUM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIMUM_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > app/signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_FILE'))
                      storePassword System.getenv('STORE_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASS=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Bangun pustaka SpongyCastle
        working-directory: libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ../../gradlew
          ../../gradlew jar --no-daemon

      - name: Bangun APK yang sudah ditandatangani
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon --stacktrace

      - name: Periksa hasil APK
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
          EXPECTED_APPLICATION_ID: ${{ vars.MINIMUM_RELEASE_APPLICATION_ID }}
        run: |
          APK=app/build/outputs/apk/foss/release/mumla-foss-release.apk
          if [[ ! -f "$APK" ]]; then
            echo "APK tidak ditemukan!" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          cp "$APK" "aplikasi-$RELEASE_TAG.apk"
          sha256sum "aplikasi-$RELEASE_TAG.apk" > "aplikasi-$RELEASE_TAG.apk.sha256"
          echo "✅ APK berhasil dibuat: aplikasi-$RELEASE_TAG.apk"

      - name: Terbitkan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$RELEASE_TAG" \
            "aplikasi-$RELEASE_TAG.apk" \
            "aplikasi-$RELEASE_TAG.apk.sha256" \
            $prerelease_flag \
            --title "Rilis $RELEASE_TAG" \
            --notes "Berhasil dibangun otomatis! 🎉"
